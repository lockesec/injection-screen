# GitHub-hosted runners only. Never attach a self-hosted runner to a public
# repository: any pull request author could run code on that machine.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04   # ubuntu-latest (26.04) has no Python 3.9
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Tests from source
        env:
          INJECTION_SCREEN_TIME_SCALE: "3"
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pytest -q
      - name: Clean install, then run the installed CLI
        run: |
          python -m venv /tmp/clean
          # hash-pinned deps and build backend first; then the package itself with
          # no dependency resolution and no build-isolation download
          /tmp/clean/bin/pip install --require-hashes -r requirements-ci.txt
          /tmp/clean/bin/pip install --no-deps --no-build-isolation .
          mkdir -p /tmp/demo && cd /tmp/demo
          printf 'An ordinary note.\n' > ok.md
          /tmp/clean/bin/injection-screen ok.md --provenance untrusted-web --no-session
      - name: The installed hook command's own tests (they skip from source)
        run: INJECTION_SCREEN_REQUIRE_INSTALLED=1 /tmp/clean/bin/python -m pytest -q -p no:cacheprovider tests/test_hook_commands.py tests/test_example_hook.py
      - name: README quick start (examples/demo.sh)
        run: PATH=/tmp/clean/bin:$PATH sh examples/demo.sh
      - name: The project's own docs pass its smuggling-lane screen
        run: |
          /tmp/clean/bin/injection-screen README.md CHANGELOG.md DESIGN.md CONTRIBUTING.md SECURITY.md docs examples --provenance repo-internal --no-session --root . --ack-file .injection-scan-ack
      - name: README transcript matches the real output
        run: PATH=/tmp/clean/bin:$PATH python examples/check_readme.py
